<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        var appearance = localStorage.getItem("codex-local:appearance:v1");
        document.documentElement.dataset.theme =
          appearance === "dark" ||
          (appearance === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {}
    </script>
    <meta
      name="description"
      content="Draftline — your models, your workspace. Code locally with llama.cpp or Ollama, file tools, and approvals."
    />
    <title>Draftline — Local coding workspace</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
